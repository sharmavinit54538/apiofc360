name: CI/CD Dev Server Deployment

on:
  push:
    branches:
      - dev
  workflow_dispatch:

env:
  APP_DIR: /root/apiofc360

jobs:
  deploy:
    name: Deploy to Dev Server
    runs-on: [self-hosted, dev]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy, Build with Git SHA, Health Check & Auto-Rollback
        run: |
          sudo bash -c "
            GIT_SHA='${{ github.sha }}'
            SHORT_SHA='${GITHUB_SHA::7}'
            echo '==================================================='
            echo \"[Deploy] Starting deployment for Git SHA: \${SHORT_SHA} (\${GIT_SHA})\"
            echo '==================================================='

            # 1. Navigate to target directory and pull latest dev code
            mkdir -p ${{ env.APP_DIR }}
            cd ${{ env.APP_DIR }}

            if [ -d '.git' ]; then
              echo '[Deploy] Pulling latest code from origin/dev...'
              git fetch origin dev
              git reset --hard origin/dev
            else
              echo '[Deploy] Syncing code from workspace...'
              rsync -a --exclude='.env' --exclude='.git' ./ ${{ env.APP_DIR }}/ 2>/dev/null || cp -r ./* ${{ env.APP_DIR }}/ 2>/dev/null || true
            fi

            # 2. Verify .env file existence
            if [ ! -f .env ]; then
              if [ -f .env.example ]; then
                echo '[Deploy] Creating .env from .env.example...'
                cp .env.example .env
              else
                cp '$GITHUB_WORKSPACE/.env.example' .env 2>/dev/null || true
              fi
            fi

            # 3. Store current running SHA / backup image for rollback
            PREV_SHA=\$(cat .last_success_sha 2>/dev/null || echo 'previous_backup')
            echo \"[Deploy] Previous successful deployment SHA: \${PREV_SHA}\"

            docker tag apiofc360-api:latest ofc360_api:\${PREV_SHA} 2>/dev/null || true
            docker tag apiofc360-celery_worker:latest ofc360_celery_worker:\${PREV_SHA} 2>/dev/null || true

            # 4. Check if PostgreSQL and Redis are UP (Zero-Touch if running)
            DB_RUNNING=\$(docker inspect -f '{{.State.Running}}' ofc360_db 2>/dev/null || echo 'false')
            REDIS_RUNNING=\$(docker inspect -f '{{.State.Running}}' ofc360_redis 2>/dev/null || echo 'false')

            if [ \"\$DB_RUNNING\" = \"true\" ] && [ \"\$REDIS_RUNNING\" = \"true\" ]; then
              echo '[Deploy] ✅ PostgreSQL (ofc360_db) & Redis (ofc360_redis) are ALREADY UP.'
              echo '[Deploy] Skipping DB and Redis. Leaving them 100% untouched!'
            else
              echo '[Deploy] ⚠️ DB or Redis is not running. Starting DB & Redis...'
              docker compose up -d db redis
            fi

            # 5. Build fresh Docker images using Git SHA tag
            echo \"[Deploy] Building fresh Docker images for Git SHA \${SHORT_SHA} (--no-cache)...\"
            docker compose build --no-cache api celery_worker
            
            docker tag apiofc360-api:latest ofc360_api:\${SHORT_SHA} 2>/dev/null || true
            docker tag apiofc360-celery_worker:latest ofc360_celery_worker:\${SHORT_SHA} 2>/dev/null || true

            # 6. Recreate ONLY API and Celery Worker containers
            echo '[Deploy] Recreating API and Celery Worker containers with new build...'
            docker compose up -d --no-deps api celery_worker

            # 7. Health Check Probe (6 retries x 5 seconds = 30 seconds max)
            echo '[Deploy] Performing health check probe on http://localhost:8000/health...'
            HEALTH_OK=false
            for i in {1..6}; do
              echo \"[Deploy] Health check attempt \$i of 6...\"
              if curl -sf http://localhost:8000/health > /dev/null; then
                HEALTH_OK=true
                echo '[Deploy] 🎉 SUCCESS: Health check probe PASSED!'
                break
              fi
              sleep 5
            done

            # 8. Success Cleanup OR Automatic Rollback to Previous Git SHA
            if [ \"\$HEALTH_OK\" = \"true\" ]; then
              echo \"[Deploy] Deployment Successful! Saving active Git SHA \${SHORT_SHA}...\"
              echo \"\${SHORT_SHA}\" > .last_success_sha
              echo '[Deploy] Cleaning dangling build images...'
              docker image prune -f
            else
              echo '[Deploy] ❌ ERROR: Health check FAILED!'
              echo '[Deploy] Printing backend logs for diagnosis:'
              docker compose logs --tail 100 api celery_worker
              
              echo \"[Deploy] 🔄 ROLLBACK INITIATED: Reverting to previous deployment SHA \${PREV_SHA}...\"
              if docker image inspect ofc360_api:\${PREV_SHA} >/dev/null 2>&1; then
                docker tag ofc360_api:\${PREV_SHA} apiofc360-api:latest
                docker tag ofc360_celery_worker:\${PREV_SHA} apiofc360-celery_worker:latest
                docker compose up -d --no-build --no-deps api celery_worker
                echo \"[Deploy] Rollback completed. Restored server to SHA \${PREV_SHA}.\"
              else
                echo '[Deploy] Warning: No previous image tag found for rollback.'
              fi
              exit 1
            fi
          "
