version: '3.8'

services:
  # Redis service for Celery broker & Caching
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # FastAPI Web Application
  api:
    build: .
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
    volumes:
      - ./uploads:/app/uploads

  # Celery Background Worker
  celery_worker:
    build: .
    restart: always
    command: celery -A app.core.celery_app worker --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis
      - api
    volumes:
      - ./uploads:/app/uploads

volumes:
  redis_data:
